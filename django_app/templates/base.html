<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Tag Verification System{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f172a; --surface: #1e293b; --surface2: #293548;
      --border: #334155; --text: #e2e8f0; --text-muted: #94a3b8;
      --primary: #3b82f6; --success: #10b981; --warning: #f59e0b;
      --danger: #ef4444; --info: #8b5cf6;
    }
    body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; font-size: 14px; }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Nav */
    nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; gap: 0; height: 52px; }
    .nav-brand { font-weight: 700; font-size: 15px; color: var(--text); margin-right: 32px; letter-spacing: -.3px; }
    .nav-brand span { color: var(--primary); }
    .nav-link { padding: 0 14px; height: 52px; display: flex; align-items: center; color: var(--text-muted); font-size: 13px; border-bottom: 2px solid transparent; transition: all .15s; }
    .nav-link:hover, .nav-link.active { color: var(--text); border-bottom-color: var(--primary); text-decoration: none; }
    .nav-spacer { flex: 1; }
    .nav-badge { background: var(--primary); color: white; border-radius: 10px; padding: 1px 7px; font-size: 11px; margin-left: 6px; }

    /* Layout */
    .container { max-width: 1400px; margin: 0 auto; padding: 28px 24px; }
    .page-header { margin-bottom: 24px; }
    .page-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .page-subtitle { color: var(--text-muted); font-size: 13px; }

    /* Cards */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
    .card-title { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--text-muted); margin-bottom: 8px; }
    .card-value { font-size: 32px; font-weight: 700; }
    .card-sub { color: var(--text-muted); font-size: 12px; margin-top: 4px; }

    .grid { display: grid; gap: 16px; }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }

    /* Badges */
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; }
    .badge-active  { background: rgba(16,185,129,.15); color: #10b981; border: 1px solid rgba(16,185,129,.3); }
    .badge-void    { background: rgba(239,68,68,.15); color: #ef4444; border: 1px solid rgba(239,68,68,.3); }
    .badge-pass    { background: rgba(16,185,129,.15); color: #10b981; border: 1px solid rgba(16,185,129,.3); }
    .badge-issues  { background: rgba(245,158,11,.15); color: #f59e0b; border: 1px solid rgba(245,158,11,.3); }
    .badge-pending { background: rgba(148,163,184,.1);  color: #94a3b8; border: 1px solid rgba(148,163,184,.2); }
    .badge-approved{ background: rgba(59,130,246,.15); color: #3b82f6; border: 1px solid rgba(59,130,246,.3); }
    .badge-shorthand { background: rgba(139,92,246,.15); color: #8b5cf6; border: 1px solid rgba(139,92,246,.3); }
    .badge-safety  { background: rgba(239,68,68,.15); color: #ef4444; }

    /* Table */
    .table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; }
    thead { background: var(--surface2); }
    th { padding: 10px 14px; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--text-muted); font-weight: 600; white-space: nowrap; }
    td { padding: 10px 14px; border-top: 1px solid var(--border); vertical-align: middle; font-size: 13px; }
    tr:hover td { background: rgba(255,255,255,.02); }
    .mono { font-family: 'Courier New', monospace; font-size: 12px; }

    /* Forms */
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; align-items: flex-end; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    input[type=text], input[type=number], input[type=file], select, textarea {
      background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      padding: 8px 12px; border-radius: 6px; font-size: 13px; outline: none;
      transition: border-color .15s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    input[type=file] { padding: 6px 12px; }

    /* Buttons */
    .btn { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 6px; transition: opacity .15s; }
    .btn:hover { opacity: .85; }
    .btn-primary  { background: var(--primary); color: white; }
    .btn-success  { background: var(--success); color: white; }
    .btn-warning  { background: var(--warning); color: white; }
    .btn-danger   { background: var(--danger); color: white; }
    .btn-ghost    { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

    /* Alert */
    .alert { padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
    .alert-info    { background: rgba(59,130,246,.1); border: 1px solid rgba(59,130,246,.3); color: #93c5fd; }
    .alert-success { background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.3); color: #6ee7b7; }
    .alert-warning { background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.3); color: #fcd34d; }
    .alert-danger  { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); color: #fca5a5; }

    /* Misc */
    .section-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .text-muted { color: var(--text-muted); }
    .mt-24 { margin-top: 24px; }
    .gap-16 { gap: 16px; }
    pre.code { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-size: 12px; overflow-x: auto; }

    @media (max-width: 900px) {
      .grid-4, .grid-3 { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
      nav { flex-wrap: wrap; height: auto; padding: 8px; }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

<nav>
  <span class="nav-brand">Tag<span>Verify</span></span>
  <a href="/dashboard/"  class="nav-link {% if request.path == '/dashboard/' %}active{% endif %}">Dashboard</a>
  <a href="/tags/"       class="nav-link {% if '/tags/' in request.path %}active{% endif %}">Tag Database</a>
  <a href="/verify/"     class="nav-link {% if '/verify/' in request.path %}active{% endif %}">Verify Document</a>
  <a href="/documents/"  class="nav-link {% if '/documents/' in request.path %}active{% endif %}">Documents</a>
  <a href="/impact/"     class="nav-link {% if '/impact/' in request.path %}active{% endif %}">Impact Analysis</a>
  <a href="/sessions/"   class="nav-link {% if '/sessions/' in request.path %}active{% endif %}">Sessions</a>
  <span class="nav-spacer"></span>
  <a href="/api/v1/"     class="nav-link">API</a>
  <a href="/admin/"      class="nav-link">Admin</a>
</nav>

<div class="container">
  {% block content %}{% endblock %}
</div>

</body>
</html>
